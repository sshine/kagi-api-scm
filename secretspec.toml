[project]
name = "kagi-api-scm"
revision = "1.0"

# Credentials for the live suite, which is skipped unless KAGI_LIVE=1 and only run via
# `just live-test`. Values come from whichever provider the developer configured; nothing
# secret belongs in this file.
[profiles.default]
KAGI_API_KEY = { description = "Kagi API key from https://kagi.com/api/keys", required = true }
KAGI_TEST_QUERY = { description = "Query the live search tests use (default: steve jobs)", required = false }
